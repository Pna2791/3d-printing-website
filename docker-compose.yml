# Orchestration per docs/devops.md — use `.env` in the project root for Compose variable substitution.
#
# --- Next.js + Supabase + Docker (read this) ---
# `NEXT_PUBLIC_*` must appear TWICE for production correctness:
#   1) `build.args` — passed into the Dockerfile builder so `next build` can inline them into the
#      **client** JavaScript bundle.
#   2) `web.environment` — available to `next start` at **runtime** for SSR, Route Handlers, and
#      server-side `process.env` (must match build-time values, or rebuild).
# Changing `.env` values for `NEXT_PUBLIC_*` requires: `docker compose build --no-cache web`
# (see docs/rules.md — Environment Rules).
#
# `DATABASE_URL` is **runtime-only** (never a Docker build arg, never sent to the browser). Use it
# for `psql`, migrations, or optional profile `local-db` with host `db`, e.g.:
#   postgresql://postgres:postgres@db:5432/postgres
#
# Schema: `supabase/migrations/*.sql` targets Supabase Postgres (auth + RLS). Apply via Supabase SQL
# editor or `psql "$DATABASE_URL"` against your Supabase DB — do not mount these into plain `db`
# initdb (vanilla Postgres lacks `auth` / JWT helpers the migration expects).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      # Na `online_slicer`: host maps 8888→8000. From this container, reach the host via:
      # http://host.docker.internal:8888 (extra_hosts below). Override in `.env` if needed.
      SLICER_API_BASE_URL: ${SLICER_API_BASE_URL:-http://host.docker.internal:8888}
      STL2THUMB_MODE: ${STL2THUMB_MODE:-auto}
      STL2THUMB_SERVICE_URL: ${STL2THUMB_SERVICE_URL:-http://thumb-service:8887}
      STL2THUMB_MATERIAL_PRESET: ${STL2THUMB_MATERIAL_PRESET:-emerald}
      STL2THUMB_THUMB_SIZE: ${STL2THUMB_THUMB_SIZE:-768}
      STL2THUMB_TIMEOUT_MS: ${STL2THUMB_TIMEOUT_MS:-120000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app
    restart: unless-stopped
    depends_on:
      thumb-service:
        condition: service_healthy

  thumb-service:
    build:
      context: ./stl2thumb
      dockerfile: Dockerfile
    # Pin port here so a stale image (old Dockerfile CMD on 8001) still matches the healthcheck / publish mapping.
    command:
      [
        "/opt/thumb/venv/bin/python",
        "-m",
        "uvicorn",
        "api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8887",
      ]
    ports:
      - "${THUMB_SERVICE_PORT:-8887}:8887"
    environment:
      MESA_GL_VERSION_OVERRIDE: ${MESA_GL_VERSION_OVERRIDE:-2.1}
      STL2THUMB_MAX_UPLOAD_MB: ${STL2THUMB_MAX_UPLOAD_MB:-52}
      STL2THUMB_RENDER_TIMEOUT_SEC: ${STL2THUMB_RENDER_TIMEOUT_SEC:-120}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8887/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - app
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    profiles:
      - local-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app
    restart: unless-stopped

# Compose creates a project-scoped network (e.g. `3d-printing-website_app`). To attach this stack
# to the same Docker network as `online_slicer` and call `http://slicer-service:8000`, use
# `docker network create app`, set both composes to `external: true` for network `app`, and set
# `SLICER_API_BASE_URL=http://slicer-service:8000`. The `thumb-service` and `web` services share
# `networks.app`, so `web` can reach `http://thumb-service:8887` and the same network can attach
# to an external `slicer-service` container when using a shared external network.
networks:
  app:
    driver: bridge

volumes:
  postgres_data:
