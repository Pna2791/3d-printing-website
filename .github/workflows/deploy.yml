name: Build & Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch: {}

# Never run two deploys at once; a newer push waits for the current deploy to finish
# (not cancelled mid-deploy, so rollback state on the server stays consistent).
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # Immutable tag for this commit — images are pinned by tag, never deployed as `latest`.
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  checks:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

  build:
    name: Build & push ${{ matrix.name }} image
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      matrix:
        include:
          - name: web
            context: .
            dockerfile: ./Dockerfile
            suffix: web
          - name: thumb
            context: ./stl2thumb
            dockerfile: ./stl2thumb/Dockerfile
            suffix: thumb
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase repository path; github.repository may contain uppercase.
      - name: Compute image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.IMAGE_TAG }}
            ${{ steps.image.outputs.name }}:master
          # NEXT_PUBLIC_* are inlined into the client bundle at build time; the thumb
          # image simply ignores these args.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: false

  deploy:
    name: Deploy to production via SSH
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy deployment files to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH'"
          # Only the compose file and deploy script are copied — never .env.
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" \
            docker-compose.prod.yml scripts/deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Deploy (pull images, restart, health check, rollback on failure)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "GHCR_PULL_TOKEN='$GHCR_PULL_TOKEN' \
             GHCR_USERNAME='$GHCR_USERNAME' \
             WEB_IMAGE_REPO='ghcr.io/${REPO_LC}-web' \
             THUMB_IMAGE_REPO='ghcr.io/${REPO_LC}-thumb' \
             IMAGE_TAG='$IMAGE_TAG' \
             DEPLOY_PATH='$DEPLOY_PATH' \
             bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          bash deploy.sh
          REMOTE
