name: Build & Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch: {}

# Never run two deploys at once; a newer push waits for the current deploy to finish
# (not cancelled mid-deploy, so rollback state on the server stays consistent).
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Immutable tag for this commit — images are pinned by tag, never deployed as `latest`.
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  checks:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

  build:
    name: Build & push ${{ matrix.name }} image
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: web
            context: .
            dockerfile: ./Dockerfile
            suffix: web
          - name: thumb
            context: ./stl2thumb
            dockerfile: ./stl2thumb/Dockerfile
            suffix: thumb
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase repository path; github.repository may contain uppercase.
      - name: Compute image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.IMAGE_TAG }}
            ${{ steps.image.outputs.name }}:master
          # NEXT_PUBLIC_* are inlined into the client bundle at build time; the thumb
          # image simply ignores these args.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_TEXT_SLICER_URL=${{ vars.NEXT_PUBLIC_TEXT_SLICER_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: false

  # Runs on the self-hosted runner installed on the production machine (MacBook Air M1
  # on a private LAN — no inbound SSH needed; the runner polls GitHub outbound).
  # This job only pulls prebuilt GHCR images and restarts the stack — it never builds.
  deploy:
    name: Deploy on production runner
    runs-on: [self-hosted, macOS, ARM64, production]
    needs: build
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # The workflow-scoped GITHUB_TOKEN can pull images that this workflow pushed
      # (packages are linked to the repo). login-action logs out again in its post step,
      # so no registry credentials linger on the production machine.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy (pull images, restart, health check, rollback on failure)
        env:
          # Optional repository Variable; defaults to the production deploy directory
          # on the MacBook Air (/Users/creator/na-3d-prod/3d-printing-website).
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        # macOS ships bash 3.2 — avoid bash-4 features like ${VAR,,} here.
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/Users/creator/na-3d-prod/3d-printing-website}"
          REPO_LC="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          mkdir -p "$DEPLOY_PATH"
          # Only the compose file and deploy script are synced — never .env.
          cp docker-compose.prod.yml scripts/deploy.sh "$DEPLOY_PATH/"

          cd "$DEPLOY_PATH"
          WEB_IMAGE_REPO="ghcr.io/${REPO_LC}-web" \
          THUMB_IMAGE_REPO="ghcr.io/${REPO_LC}-thumb" \
          IMAGE_TAG="$IMAGE_TAG" \
          bash deploy.sh
